<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster AI | Register</title>

    <link rel="stylesheet" href="/register.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Home Button -->

    <a href="index.html" class="homeBtn">

        <i class="fa-solid fa-arrow-left"></i>

        Home

    </a>

    <!-- Register Card -->

    <div class="container">

        <div class="register-card">

            <div class="logo">

                <i class="fa-solid fa-graduation-cap"></i>

                <h2>QuizMaster AI</h2>

            </div>

            <h1>Create Account</h1>

            <p>

                Register to participate in online quiz competitions.

            </p>

            <form id="registerForm">

                <div class="inputBox">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Full Name"
                        required>

                </div>

                <div class="inputBox">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <div class="inputBox">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Mobile Number"
                        required>

                </div>

                <div class="inputBox">

                    <i class="fa-solid fa-building-columns"></i>

                    <input
                        type="text"
                        id="college"
                        placeholder="College Name"
                        required>

                </div>

                <div class="inputBox">

                    <i class="fa-solid fa-id-card"></i>

                    <input
                        type="text"
                        id="studentid"
                        placeholder="Student ID"
                        required>

                </div>

                <div class="inputBox">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye eye"
                        id="togglePassword">

                    </i>

                </div>

                <div class="inputBox">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required>

                </div>

                <button
                    class="registerBtn"
                    type="submit">

                    Register Now

                </button>

            </form>

            <div class="login">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </div>

        </div>

    </div>

    <script src="/register.js"></script>

</body>

</html>
