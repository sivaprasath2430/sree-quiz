<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizMaster AI | Admin Login</title>

<link rel="stylesheet" href="/admin-login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="loginBox">

    <i class="fa-solid fa-user-shield icon"></i>

    <h1>Admin Login</h1>

    <p>Only Administrator Can Access</p>

    <form id="adminLoginForm">

        <input
        type="text"
        id="username"
        placeholder="Username"
        required>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye eye"
                        id="togglePassword">

                    </i>

        <button type="submit">

            Login

        </button>

    </form>

</div>

<script src="/admin-login.js"></script>

</body>

</html>
