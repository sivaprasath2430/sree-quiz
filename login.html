<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster AI | Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Home Button -->

    <a href="index.html" class="homeBtn">

        <i class="fa-solid fa-arrow-left"></i>

        Home

    </a>

    <!-- Login Box -->

    <div class="container">

        <div class="login-card">

            <div class="logo">

                <i class="fa-solid fa-graduation-cap"></i>

                <h2>QuizMaster AI</h2>

            </div>

            <h1>Welcome Back 👋</h1>

            <p>

                Login to continue your quiz journey.

            </p>

            <!-- Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="inputBox">

                    <i class="fa-solid fa-id-card"></i>

                    <input
                        type="text"
                        id="studentid"
                        placeholder="Enter student id"  
                        required>

                </div>

                <!-- Password -->

                <div class="inputBox">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye eye"
                        id="togglePassword">

                    </i>

                </div>

                <!-- Remember -->

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

                <!-- Login Button -->

                <button
                    class="loginBtn"
                    type="submit">

                    Login

                </button>

            </form>

            <!-- Divider -->

            <div class="divider">

                <span>

                    OR

                </span>

            </div>

            </div>

            <!-- Register -->

            <div class="register">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="/login.js"></script>

</body>

</html>
