<!DOCTYPE html>
<html>
<head>

    <title>Quiz Analysis</title>

    <link rel="stylesheet" href="analysis.css">

</head>

<body>

<div class="container">

    <h1>Quiz Analysis</h1>

    <div class="cards">

        <div class="card">
            <h2 id="students">0</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2 id="attempts">0</h2>
            <p>Total Attempts</p>
        </div>

        <div class="card">
            <h2 id="highest">0%</h2>
            <p>Highest Score</p>
        </div>

        <div class="card">
            <h2 id="average">0%</h2>
            <p>Average Score</p>
        </div>

    </div>

    <h2>Recent Results</h2>

    <table>

        <thead>

            <tr>

                <th>Student</th>
                <th>Quiz</th>
                <th>Score</th>
                <th>Percentage</th>

            </tr>

        </thead>

        <tbody id="resultTable">

        </tbody>

    </table>

</div>

<script src="analysis.js"></script>

</body>
</html>
